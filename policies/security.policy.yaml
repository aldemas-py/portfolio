apiVersion: compliance.njengasam.io/v1
kind: SecurityPolicy
metadata:
  name: portfolio-security-baseline
  category: security
spec:
  version: 1.0.0
  complianceFrameworks:
    - OWASP-ASVS-L1
    - GDPR-RECITALS
  session:
    cookie_httponly: true
    cookie_samesite: Strict
    cookie_secure: false # set true when served over HTTPS in production
    use_only_cookies: true
    use_strict_mode: true
    session_timeout_seconds: 1800
  transport:
    hsts_enabled: true
    minimum_tls: "1.2"
    force_https_redirect: true
  headers:
    # Security-related HTTP response headers (set in includes/compliance.php)
    X-Content-Type-Options: nosniff
    X-Frame-Options: DENY
    Referrer-Policy: no-referrer-when-downgrade
    X-XSS-Protection: "1; mode=block"
    Permissions-Policy: "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data:; frame-ancestors 'none'"
  inputValidation:
    prepare_statements: true
    output_encoding: true
    upload_max_size_mb: 5
    upload_allowed_types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
    upload_dir_not_executable: true
  rateLimiting:
    login_attempts_threshold: 5
    lockout_seconds: 300
  sensitiveData:
    password_hashing: "PASSWORD_DEFAULT (bcrypt)
    personal_data_scope: minimal
    logs_do_not_store_password: true
  auditLogging:
    enabled: true
    eventsLogged:
      - admin_login
      - admin_logout
      - admin_crud
      - failed_login
    retention_days: 90
status:
  enforced: true
  verified: periodically
  tooling:
    - manual_review
    - php_lint

